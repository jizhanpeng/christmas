<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#010409">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/scene.css">
<title>Merry Christmas</title>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="c"></canvas>
<div class="frame" aria-hidden="true"></div>
<header class="masthead" aria-hidden="true">
  <div class="brand"><span class="brand-star">✦</span><span>NOËL</span></div>
  <div class="edition">WINTER EDITION <span>MMXXVI</span></div>
</header>
<main class="greeting">
  <div class="eyebrow">THE SEASON OF LIGHT</div>
  <h1><span class="merry">Merry</span><span class="christmas">Christmas</span></h1>
  <p class="tagline">May the quiet light find you.</p>
  <div class="wish">PEACE <i>·</i> LOVE <i>·</i> JOY</div>
</main>
<div class="side-note" aria-hidden="true">THE NIGHT IS FULL OF SMALL MIRACLES</div>
<footer class="colophon" aria-hidden="true"><span>UNDER THE SAME STARS</span><span>DECEMBER / 2026</span></footer>
<div class="interaction-hint" id="hint">TOUCH THE LIGHT · WATCH IT RETURN</div>
<audio id="bgm" src="music/孙燕姿 - 遇见.web.m4a" preload="metadata" loop autoplay></audio>
<div class="lyrics-viewport" aria-hidden="true">
  <div class="lyrics-track" id="lyricsTrack"></div>
</div>
<div class="music-control" id="musicControl" role="group" aria-label="背景音乐播放器">
  <span class="music-status" id="musicStatus" role="status" aria-live="polite"></span>
  <div class="cd-disc" aria-hidden="true">
    <img class="cd-cover" src="img/孙燕姿-thumb.webp" alt="" width="320" height="432" decoding="async" draggable="false">
    <span class="cd-hole"></span>
  </div>
  <div class="music-details">
    <div class="music-heading">
      <div class="music-meta">
        <strong class="music-title">遇见</strong>
        <span class="music-artist">孙燕姿</span>
      </div>
      <button class="music-toggle" id="musicToggle" type="button" aria-controls="bgm"
        aria-pressed="false" aria-label="播放背景音乐：孙燕姿《遇见》">
        <span class="music-icon" aria-hidden="true"></span>
      </button>
    </div>
    <label class="visually-hidden" for="musicSeek">孙燕姿《遇见》播放进度</label>
    <input class="music-seek" id="musicSeek" type="range" min="0" max="209.77" step="0.1"
      value="0" aria-controls="bgm" aria-valuetext="0:00 / 3:29" disabled>
    <div class="music-times" aria-hidden="true">
      <span id="musicElapsed">0:00</span><span id="musicDuration">3:29</span>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/shaders.js"></script>
<script src="js/ornaments.js"></script>
<script src="js/particles.js"></script>
<script src="js/background.js"></script>
<script src="js/renderer.js"></script>
<script src="js/lyrics.js"></script>
<script src="js/music.js"></script>
<script src="js/main.js"></script>
</body>
</html>
